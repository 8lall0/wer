# A static SDL3 in deps/sdl3-linux (scripts/build-sdl3.sh linux), kept
# between runs: Ubuntu 24.04 has no SDL3 package. Link with
#   -L deps/sdl3-linux/lib -z -pthread -z -lm
name: Set up SDL3
description: Build (or restore) a static SDL3 for Linux
inputs:
  version:
    description: SDL release (e.g. 3.4.18)
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v5
      with:
        path: deps/sdl3-linux
        key: sdl3-linux-${{ inputs.version }}-${{ hashFiles('scripts/build-sdl3.sh') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDL_VERSION: ${{ inputs.version }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
          libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
          libgles2-mesa-dev libdbus-1-dev libudev-dev libibus-1.0-dev
        scripts/build-sdl3.sh linux
