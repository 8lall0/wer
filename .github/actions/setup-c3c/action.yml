# Installs the C3 compiler from its GitHub release (Linux x64) and puts
# c3c on the PATH.
name: Set up c3c
description: Install a given release of the C3 compiler
inputs:
  version:
    description: c3c release, without the v (e.g. 0.8.4)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sfL "https://github.com/c3lang/c3c/releases/download/v${{ inputs.version }}/c3-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/c3/c3c" --version
